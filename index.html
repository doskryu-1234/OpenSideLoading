<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSideLoading</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161a;
            --accent-color: #2563eb;
            --text-color: #ffffff;
            --sub-text: #a1a1aa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        h2 { font-size: 1.2rem; margin-top: 0; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--sub-text); margin-bottom: 4px; }
        input[type="text"], input[type="file"], input[type="password"] {
            width: 100%; padding: 10px; background: #22222a; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 14px; background-color: var(--accent-color); border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        #result { margin-top: 15px; text-align: center; word-break: break-all; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; font-size: 1.5rem;">OpenSideLoading</h1>
        <div class="card">
            <h2>IPA Signer</h2>
            <form id="signForm">
                <div class="input-group">
                    <label>IPA 직접 다운로드 링크 (URL)</label>
                    <input type="text" id="ipaUrlInput" placeholder="https://..." required>
                </div>
                <div class="input-group">
                    <label>P12 인증서 파일</label>
                    <input type="file" id="p12File" accept=".p12" required>
                </div>
                <div class="input-group">
                    <label>Mobileprovision 프로파일 파일</label>
                    <input type="file" id="provFile" accept=".mobileprovision" required>
                </div>
                <div class="input-group">
                    <label>P12 암호</label>
                    <input type="password" id="p12Password" placeholder="비밀번호가 없으면 비워두세요">
                </div>
                <button type="submit" id="submitBtn">앱 서명 및 설치 시작</button>
            </form>
            <div id="result"></div>
        </div>
    </div>

    <script>
        // GitHub Pages 환경에 맞춘 manifest.plist 주소 설정
        const REPO_OWNER = "doskryu-1234";
        const REPO_NAME = "OpenSideLoading";
        const PLIST_URL = `https://${REPO_OWNER}.github.io/${REPO_NAME}/manifest.plist`;

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        document.getElementById('signForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            resultDiv.innerText = "인증서 데이터 변환 중...";

            try {
                const ipaUrl = document.getElementById('ipaUrlInput').value;
                const p12File = document.getElementById('p12File').files[0];
                const provFile = document.getElementById('provFile').files[0];
                const p12Password = document.getElementById('p12Password').value;

                const p12Base64 = await fileToBase64(p12File);
                const provBase64 = await fileToBase64(provFile);

                resultDiv.innerText = "서명 작업 요청 중... (약 1~2분 소요)";

                // 브라우저가 직접 깃허브에 쏘지 않고, Vercel 서버(/api/sign)를 안전하게 거쳐서 요청
                const res = await fetch('/api/sign', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ipa_url: ipaUrl,
                        p12_base64: p12Base64,
                        prov_base64: provBase64,
                        p12_password: p12Password
                    })
                });

                if (!res.ok) throw new Error("서명 요청 실패");

                // 깃허브 액션이 완료될 시간을 고려해 여유 있게 대기 (약 35초)
                resultDiv.innerText = "서명 진행 중... 잠시만 기다려주세요.";
                await new Promise(r => setTimeout(r, 35000));
                
                resultDiv.innerText = "서명 완료! 설치 팝업을 호출합니다...";
                
                window.location.href = `itms-services://?action=download-manifest&url=${PLIST_URL}`;

            } catch (err) {
                resultDiv.innerText = "오류 발생: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
