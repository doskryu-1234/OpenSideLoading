name: iOS IPA Signer & OTA

on:
  repository_dispatch:
    types: [trigger-sign]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Install zsign
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev zip wget git
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          g++ src/*.cpp -lcrypto -O3 -o zsign 2>/dev/null || g++ *.cpp -lcrypto -O3 -o zsign
          sudo mv zsign /usr/local/bin/

      - name: Download IPA
        run: |
          wget -O input.ipa "${{ github.event.client_payload.ipa_url }}"

      - name: Decode Certificates
        run: |
          echo "${{ github.event.client_payload.p12_base64 }}" | base64 -d > cert.p12
          echo "${{ github.event.client_payload.prov_base64 }}" | base64 -d > cert.mobileprovision

      - name: Execute Sign
        run: |
          P12_PASS="${{ github.event.client_payload.p12_password }}"
          if [ -z "$P12_PASS" ]; then
            zsign -k cert.p12 -m cert.mobileprovision -o output.ipa input.ipa
          else
            zsign -k cert.p12 -p "$P12_PASS" -m cert.mobileprovision -o output.ipa input.ipa
          fi

      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ota --cleanup-tag -y 2>/dev/null || true
          IPA_DL_URL="https://github.com/${{ github.repository }}/releases/download/ota/output.ipa"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>items</key>\n<array>\n<dict>\n<key>assets</key>\n<array>\n<dict>\n<key>kind</key>\n<string>software-package</string>\n<key>url</key>\n<string>%s</string>\n</dict>\n</array>\n<key>metadata</key>\n<dict>\n<key>bundle-identifier</key>\n<string>com.opensideloading.app</string>\n<key>bundle-version</key>\n<string>1.0</string>\n<key>kind</key>\n<string>software</string>\n<key>title</key>\n<string>Signed App</string>\n</dict>\n</dict>\n</array>\n</dict>\n</plist>' "$IPA_DL_URL" > manifest.plist
          gh release create ota output.ipa manifest.plist --title "OTA Release" --notes "Signed IPA & Manifest"
