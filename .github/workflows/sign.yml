name: iOS IPA Signer & OTA

on:
  repository_dispatch:
    types: [trigger-sign]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout zsign Source
        uses: actions/checkout@v4
        with:
          repository: zhlynn/zsign
          path: zsign_src

      - name: Build and Install zsign
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ pkg-config libssl-dev
          cd zsign_src/build/linux
          make clean && make
          sudo mv ${{ github.workspace }}/zsign_src/bin/zsign /usr/local/bin/

      - name: Download and Verify IPA
        run: |
          IPA_URL="${{ github.event.client_payload.ipa_url }}"
          echo "Downloading IPA from: $IPA_URL"
          curl -L -o input.ipa "$IPA_URL"
          
          # 다운로드된 파일의 앞부분 확인 (디버깅용 출력)
          echo "=== 파일 헤더 내용 출력 ==="
          head -c 100 input.ipa
          echo "========================"

          # 파일이 HTML(오류 페이지나 잘못된 링크)인지 검증
          if grep -q "<html" input.ipa || grep -q "<DOCTYPE" input.ipa; then
            echo "❌ 오류: 다운로드된 파일이 IPA가 아니라 HTML 웹페이지입니다."
            echo "입력하신 링크($IPA_URL)가 잘못되었거나 파일 직접 다운로드 링크가 아닙니다."
            exit 255
          fi

          echo "✅ IPA 파일 다운로드 및 검증 완료!"

      - name: Decode Certs
        run: |
          echo "${{ github.event.client_payload.p12_base64 }}" | base64 -d > cert.p12
          echo "${{ github.event.client_payload.prov_base64 }}" | base64 -d > cert.mobileprovision

      - name: Execute Sign
        run: |
          P12_PASS="${{ github.event.client_payload.p12_password }}"
          if [ -z "$P12_PASS" ]; then
            zsign -k cert.p12 -m cert.mobileprovision -o output.ipa input.ipa
          else
            zsign -k cert.p12 -p "$P12_PASS" -m cert.mobileprovision -o output.ipa input.ipa
          fi

      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # IPA 파일 안에서 실제 번들 ID 자동 추출
          BUNDLE_ID=$(python3 -c "
          import zipfile, plistlib
          with zipfile.ZipFile('input.ipa', 'r') as z:
              for filename in z.namelist():
                  if filename.endswith('.app/Info.plist'):
                      pl = plistlib.loads(z.read(filename))
                      print(pl.get('CFBundleIdentifier', 'com.opensideloading.app'))
                      break
          ")
          echo "Extracted Bundle ID: $BUNDLE_ID"

          gh release delete ota --cleanup-tag -y 2>/dev/null || true
          IPA_DL_URL="https://github.com/${{ github.repository }}/releases/download/ota/output.ipa"
          
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>items</key>\n<array>\n<dict>\n<key>assets</key>\n<array>\n<dict>\n<key>kind</key>\n<string>software-package</string>\n<key>url</key>\n<string>%s</string>\n</dict>\n</array>\n<key>metadata</key>\n<dict>\n<key>bundle-identifier</key>\n<string>%s</string>\n<key>bundle-version</key>\n<string>1.0</string>\n<key>kind</key>\n<string>software</string>\n<key>title</key>\n<string>Signed App</string>\n</dict>\n</dict>\n</array>\n</dict>\n</plist>' "$IPA_DL_URL" "$BUNDLE_ID" > manifest.plist
          
          gh release create ota output.ipa manifest.plist --title "OTA Release" --notes "Signed IPA & Manifest"
