<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSideLoading</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161a;
            --accent-color: #2563eb;
            --text-color: #ffffff;
            --sub-text: #a1a1aa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        h2 { font-size: 1.2rem; margin-top: 0; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--sub-text); margin-bottom: 4px; }
        input[type="file"], input[type="password"] {
            width: 100%; padding: 10px; background: #22222a; border: 1px solid #333; border-radius: 8px; color: #fff; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 14px; background-color: var(--accent-color); border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        #result { margin-top: 15px; text-align: center; word-break: break-all; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; font-size: 1.5rem;">OpenSideLoading</h1>
        <div class="card">
            <h2>IPA Signer</h2>
            <form id="signForm">
                <div class="input-group">
                    <label>IPA 파일</label>
                    <input type="file" id="ipaFile" accept="*/*" required>
                </div>
                <div class="input-group">
                    <label>P12 인증서</label>
                    <input type="file" id="p12File" accept="*/*" required>
                </div>
                <div class="input-group">
                    <label>Mobileprovision 프로파일</label>
                    <input type="file" id="provFile" accept="*/*" required>
                </div>
                <div class="input-group">
                    <label>P12 암호</label>
                    <input type="password" id="p12Password" placeholder="비밀번호가 없으면 비워두세요">
                </div>
                <button type="submit" id="submitBtn">앱 서명 시작</button>
            </form>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const GITHUB_PAT = "새로_발급받은_토큰_입력";
        const REPO_OWNER = "doskryu-1234";
        const REPO_NAME = "OpenSideLoading";

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        const uploadIpaToTempStorage = async (file) => {
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            const res = await fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) throw new Error("IPA 임시 업로드 실패");
            return await res.text();
        };

        document.getElementById('signForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            resultDiv.innerText = "IPA 파일 전송 준비 중... (용량에 따라 수십 초 소요)";

            try {
                const ipaFile = document.getElementById('ipaFile').files[0];
                const p12File = document.getElementById('p12File').files[0];
                const provFile = document.getElementById('provFile').files[0];
                const p12Password = document.getElementById('p12Password').value;

                const ipaUrl = await uploadIpaToTempStorage(ipaFile);
                resultDiv.innerText = "인증서 파일 변환 중...";

                const p12Base64 = await fileToBase64(p12File);
                const provBase64 = await fileToBase64(provFile);

                resultDiv.innerText = "GitHub Actions로 서명 요청 전송 중...";

                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_PAT}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'trigger-sign',
                        client_payload: {
                            ipa_url: ipaUrl,
                            p12_base64: p12Base64,
                            prov_base64: provBase64,
                            p12_password: p12Password
                        }
                    })
                });

                if (res.ok) {
                    resultDiv.innerText = "요청 성공! 백엔드에서 서명 중입니다. 약 1~2분 후 GitHub Actions 탭을 확인하십시오.";
                } else {
                    resultDiv.innerText = "요청 실패. 토큰 유효성을 확인하십시오.";
                }
            } catch (err) {
                resultDiv.innerText = "오류 발생: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
