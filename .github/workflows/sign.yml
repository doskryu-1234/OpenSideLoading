name: iOS IPA Signer & OTA

on:
  repository_dispatch:
    types: [trigger-sign]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install zsign
        run: |
          sudo apt-get update
          sudo apt-get install -y zsign wget curl

      - name: Download IPA
        run: |
          wget -O input.ipa "${{ github.event.client_payload.ipa_url }}"

      - name: Decode Certificates
        run: |
          echo "${{ github.event.client_payload.p12_base64 }}" | base64 -d > cert.p12
          echo "${{ github.event.client_payload.prov_base64 }}" | base64 -d > cert.mobileprovision

      - name: Execute Sign
        run: |
          P12_PASS="${{ github.event.client_payload.p12_password }}"
          if [ -z "$P12_PASS" ]; then
            zsign -k cert.p12 -m cert.mobileprovision -o output.ipa input.ipa
          else
            zsign -k cert.p12 -p "$P12_PASS" -m cert.mobileprovision -o output.ipa input.ipa
          fi

      - name: Create Release & Upload Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 기존 ota 태그가 있다면 삭제
          gh release delete ota --cleanup-tag -y || true

          # IPA 파일 다운로드 직링크 주소 구성
          IPA_DL_URL="https://github.com/${{ github.repository }}/releases/download/ota/output.ipa"

          # manifest.plist 작성
          cat <<EOF > manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${IPA_DL_URL}</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.opensideloading.app</string>
                          <key>bundle-version</key>
                          <string>1.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>Signed App</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          EOF

          # GitHub Release 생성 및 파일 2개(IPA, plist) 업로드
          gh release create ota output.ipa manifest.plist --title "OTA Release" --notes "Signed IPA & Manifest"
